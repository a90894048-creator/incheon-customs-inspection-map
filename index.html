<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --ink:#15181d; --ink2:#5b616e; --line:#e2e5ea;
  --accent:#1b63d8; --accent-soft:#e8f0fe; --shadow:0 1px 3px rgba(16,24,40,.08),0 8px 24px rgba(16,24,40,.06);
  --zE:#2563eb; --zF:#059669; --zG:#d97706; --zH:#dc2626;
  --zA:#7c3aed; --zB:#0891b2; --zC:#db2777; --zD:#65a30d;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1116; --panel:#171b22; --ink:#e8eaee; --ink2:#99a1b0; --line:#272d37;
    --accent:#5b93f5; --accent-soft:#1c2740; --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Pretendard","Malgun Gothic","맑은 고딕",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}

/* ---------- layout ---------- */
#app{display:flex;flex-direction:column;height:100dvh}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);
  border-bottom:1px solid var(--line);flex:none;z-index:1000}
h1{font-size:15px;margin:0;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.rev{font-size:11px;color:var(--ink2);background:var(--bg);border:1px solid var(--line);
  padding:2px 7px;border-radius:999px;white-space:nowrap}
.search{flex:1;position:relative;min-width:110px;max-width:420px}
.search input{width:100%;padding:8px 30px 8px 32px;border:1px solid var(--line);border-radius:9px;
  background:var(--bg);color:var(--ink);font-size:14px;outline:none}
.search input:focus{border-color:var(--accent);background:var(--panel)}
.search .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink2);font-size:13px}
.search .clr{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;
  color:var(--ink2);padding:4px 8px;display:none;font-size:15px}
.search.has .clr{display:block}
.tbtn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 11px;
  font-size:13px;white-space:nowrap}
.tbtn:hover{border-color:var(--accent);color:var(--accent)}
.tbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}

main{flex:1;display:flex;min-height:0}
aside{width:340px;flex:none;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0}
#map{flex:1;min-width:0;background:var(--bg)}

/* ---------- sidebar ---------- */
.filters{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
.seg{display:flex;gap:3px;background:var(--bg);padding:3px;border-radius:10px}
.seg button{flex:1;border:0;background:none;padding:7px 2px;border-radius:8px;font-size:11.5px;
  font-weight:600;color:var(--ink2);letter-spacing:-.03em;white-space:nowrap}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px;
  font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c);display:block;font-style:normal}
.chip.off{opacity:.38}
.flow{font-size:11px;color:var(--ink2);line-height:1.55}
.flow .ft{display:block;font-weight:700;margin-bottom:1px}
.flow .fl{display:block;white-space:nowrap}
.flow .fl b{color:var(--ink);font-weight:700;margin-right:3px}

.list{flex:1;overflow:auto;padding:4px 0 12px;-webkit-overflow-scrolling:touch}
.zhead{position:sticky;top:0;background:var(--panel);padding:9px 12px 7px;font-size:12px;
  font-weight:700;color:var(--ink2);display:flex;align-items:center;gap:7px;z-index:2;
  border-bottom:1px solid var(--line);cursor:pointer;-webkit-user-select:none;user-select:none}
.zhead:hover{background:var(--accent-soft)}
.zhead b{color:var(--c);font-size:13px}
.zhead .only{margin-left:auto;font-size:10.5px;font-weight:600;color:var(--accent);
  border:1px solid var(--accent);border-radius:999px;padding:1px 7px;opacity:.8}
.zhead:hover .only{opacity:1}
.zhead.solo{background:var(--accent-soft)}
.zhead .cnt{font-weight:500;opacity:.8}
.item{display:flex;gap:9px;align-items:flex-start;padding:9px 12px;cursor:pointer;
  border-bottom:1px solid var(--line)}
.item:hover{background:var(--accent-soft)}
.item.sel{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.num{flex:none;width:21px;height:21px;border-radius:50%;background:var(--c);color:#fff;
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.meta{min-width:0;flex:1}
.nm{font-size:13.5px;font-weight:600;line-height:1.35;word-break:keep-all}
.ad{font-size:11.5px;color:var(--ink2);margin-top:2px;line-height:1.35}
.pick{flex:none;width:22px;height:22px;border:1.5px solid var(--line);border-radius:6px;
  background:var(--panel);font-size:12px;color:transparent;display:flex;align-items:center;
  justify-content:center;margin-top:1px}
.pick.on{background:var(--accent);border-color:var(--accent);color:#fff}
.empty{padding:28px 16px;text-align:center;color:var(--ink2);font-size:13px}

/* ---------- route bar ---------- */
.routebar{flex:none;border-top:1px solid var(--line);background:var(--panel);padding:9px 12px;
  display:none;gap:8px;align-items:center}
.routebar.on{display:flex}
.routebar .t{font-size:12.5px;font-weight:600;flex:1}
.routebar .t span{color:var(--accent)}
.mini{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px;font-size:12px}
.mini.p{background:var(--accent);border-color:var(--accent);color:#fff}

/* ---------- markers ---------- */
.pin{width:26px;height:26px;border-radius:50% 50% 50% 2px;transform:rotate(-45deg);
  background:var(--c);border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.35);
  display:flex;align-items:center;justify-content:center}
.pin b{transform:rotate(45deg);color:#fff;font-size:12px;font-weight:700;line-height:1}
.pin.act{width:34px;height:34px;z-index:900;border-width:3px}
.pin.act b{font-size:15px}
.pin.dim{opacity:.3}
.arw{color:var(--c);font-size:15px;line-height:1;text-shadow:0 0 3px #fff,0 0 3px #fff}

/* ---------- popup ---------- */
.leaflet-popup-content-wrapper{border-radius:12px;box-shadow:var(--shadow);background:var(--panel);color:var(--ink)}
.leaflet-popup-content{margin:12px 14px;min-width:210px}
.leaflet-popup-tip{background:var(--panel)}
.pp .bdg{display:inline-block;background:var(--c);color:#fff;font-size:11px;font-weight:700;
  padding:2px 8px;border-radius:999px;margin-bottom:6px}
.pp .dp{font-size:11px;color:var(--ink2);margin-left:6px}
.pp h3{margin:0 0 4px;font-size:15px;font-weight:700;word-break:keep-all}
.pp p{margin:0 0 10px;font-size:12.5px;color:var(--ink2);line-height:1.4}
.pp .btns{display:flex;flex-wrap:wrap;gap:6px}
.pp .btns a,.pp .btns button{border:1px solid var(--line);background:var(--bg);border-radius:8px;
  padding:6px 10px;font-size:12px;text-decoration:none;color:var(--ink)}
.pp .btns a:hover,.pp .btns button:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- route sheet ---------- */
.modal{position:fixed;inset:0;background:rgba(10,14,20,.45);display:none;z-index:2000;
  align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.sheet{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);width:100%;max-width:430px;
  max-height:84dvh;display:flex;flex-direction:column;overflow:hidden}
.sheet header{border-bottom:1px solid var(--line);padding:13px 15px;justify-content:space-between}
.sheet h2{margin:0;font-size:14.5px}
.sheet .body{overflow:auto;padding:6px 0}
.step{display:flex;gap:10px;padding:10px 15px;align-items:flex-start;border-bottom:1px solid var(--line)}
.step .n{flex:none;width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;font-size:11px;
  font-weight:700;display:flex;align-items:center;justify-content:center}
.step .go{margin-left:auto;flex:none;font-size:11.5px;text-decoration:none;color:var(--accent);
  border:1px solid var(--line);border-radius:7px;padding:5px 8px}
.sheet .foot{border-top:1px solid var(--line);padding:10px 15px;display:flex;gap:8px;justify-content:flex-end}

.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,14px);background:#15181d;color:#fff;
  padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;
  transition:.22s;z-index:3000}
.toast.on{opacity:.95;transform:translate(-50%,0)}

/* ---------- mobile ---------- */
.mtabs{display:none;flex:none;border-top:1px solid var(--line);background:var(--panel)}
.mtabs button{flex:1;border:0;background:none;padding:11px 0;font-size:13px;font-weight:600;color:var(--ink2)}
.mtabs button.on{color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
@media (max-width:760px){
  header{flex-wrap:wrap;padding:9px 12px 10px;gap:8px}
  h1{font-size:14px}
  .search{order:3;flex-basis:100%;max-width:none}
  main{position:relative}
  aside{position:absolute;inset:0;width:auto;border-right:0;z-index:600}
  #map{position:absolute;inset:0}
  body[data-view="map"] aside{display:none}
  body[data-view="list"] #map{visibility:hidden}
  .mtabs{display:flex}
}
@media print{
  header .search,header .tbtn,.mtabs,.routebar,#map,.filters .seg{display:none!important}
  aside{width:auto;border:0}
  .list{overflow:visible}
  body{background:#fff}
}
</style>
</head>
<body data-view="map">
<div id="app">
  <header>
    <h1>인천항 세관검사 창고</h1>
    <span class="rev" id="rev">기준 2026-11-09</span>
    <div class="search" id="sw">
      <span class="ic">⌕</span>
      <input id="q" type="search" placeholder="창고명 · 주소 검색 (예: 선광, 축항대로)" autocomplete="off">
      <button class="clr" id="qc" aria-label="지우기">×</button>
    </div>
    <button class="tbtn" id="sat">위성</button>
    <button class="tbtn" id="fit">전체</button>
  </header>

  <main>
    <aside>

  const k=w.lat.toFixed(5)+","+w.lon.toFixed(5);
  seen[k]=(seen[k]||0)+1;
  const off=(seen[k]-1)*0.00022;
  w.mlat=w.lat+off; w.mlon=w.lon+off;
  const m=L.marker([w.mlat,w.mlon],{icon:pinIcon(w,false)}).bindPopup(()=>popupHTML(w));
  m.on("click",()=>select(w.id,false));
  markers[w.id]=m;
});

function arrowIcon(color,deg){
  return L.divIcon({className:"",iconSize:[16,16],iconAnchor:[8,8],
    html:`<div class="arw" style="--c:${color};transform:rotate(${deg}deg)">➤</div>`});
}
function draw(){
  markerLayer.clearLayers(); lineLayer.clearLayers();
  const vis = DATA.filter(visible);
  vis.forEach(w=> markerLayer.addLayer(markers[w.id]));
  // 구역별 순서선
  const groups={};
  vis.forEach(w=>{ const k=w.dept+"|"+w.zone; (groups[k]=groups[k]||[]).push(w); });
  Object.values(groups).forEach(g=>{
    if(g.length<2) return;
    g.sort((a,b)=>a.order-b.order);
    const pts=g.map(w=>[w.mlat,w.mlon]), c=ZC[g[0].zone];
    L.polyline(pts,{color:c,weight:3,opacity:.65,dashArray:"7,6"}).addTo(lineLayer);
    for(let i=0;i<pts.length-1;i++){
      const [y1,x1]=pts[i],[y2,x2]=pts[i+1];
      const mid=[y1+(y2-y1)*.55, x1+(x2-x1)*.55];
      const deg=Math.atan2(x2-x1,y2-y1)*180/Math.PI;
      L.marker(mid,{icon:arrowIcon(c,deg-90),interactive:false}).addTo(lineLayer);
    }
  });
  return vis;
}

/* ===== 사이드바 ===== */
function renderChips(){
  const box=document.getElementById("chips"); box.innerHTML="";
  deptZones().forEach(z=>{
    const b=document.createElement("button");
    b.className="chip"+(st.zones.has(z)?"":" off");
    b.style.setProperty("--c",ZC[z]);
    b.innerHTML=`<i></i>${zoneChip(z)}`;
    b.onclick=()=>{ st.zones.has(z)?st.zones.delete(z):st.zones.add(z); render(); fitAll(); };
    box.appendChild(b);
  });
}
/* 검사 진행 순서 안내 — 한 번만 그리고, 필터를 바꿔도 그대로 둔다 */
function initFlow(){
  document.getElementById("flow").innerHTML =
    `<span class="ft">검사 진행 순서</span>` +
    DEPTS.filter(d=>ZONE_ORDER[d].length>1)
      .map(d=>`<span class="fl"><b>${SHORT(d)}</b> ${ZONE_ORDER[d].join(" → ")}</span>`).join("");
}
function render(){
  const vis = draw();
  renderChips();
  const list=document.getElementById("list"); list.innerHTML="";
  if(!vis.length){ list.innerHTML='<div class="empty">조건에 맞는 창고가 없습니다.</div>'; return; }
  vis.sort((a,b)=>sortKey(a)-sortKey(b));
  let cur="";
  vis.forEach(w=>{
    const k=w.dept+"|"+w.zone;
    if(k!==cur){
      cur=k;
      const n=vis.filter(x=>x.dept+"|"+x.zone===k).length;
      const solo=isSolo(w.dept,w.zone);
      const h=document.createElement("div");
      h.className="zhead"+(solo?" solo":""); h.style.setProperty("--c",ZC[w.zone]);
      h.title=solo?"모든 구역 다시 보기":"이 구역만 보기";
      h.innerHTML=`<b>${zoneLabel(w.zone)}</b> ${SHORT(w.dept)}`+
        `<span class="only">${solo?"전체 보기":(ZLABEL[w.zone]?"이것만":"이 구역만")}</span>`+
        `<span class="cnt">${n}곳</span>`;
      h.onclick=()=>soloZone(w.dept,w.zone);
      list.appendChild(h);
    }
    const el=document.createElement("div");
    el.className="item"+(st.sel===w.id?" sel":"");
    el.style.setProperty("--c",ZC[w.zone]);
    el.innerHTML=`<div class="num">${pinLabel(w)}</div>
      <div class="meta"><div class="nm">${w.name}</div><div class="ad">${w.addr}</div></div>
      <button class="pick${st.picked.has(w.id)?" on":""}" title="동선에 추가">✓</button>`;
    el.onclick=e=>{
      if(e.target.classList.contains("pick")){
        st.picked.has(w.id)?st.picked.delete(w.id):st.picked.add(w.id);
        e.target.classList.toggle("on"); routebar(); e.stopPropagation(); return;
      }
      select(w.id,true);
    };
    list.appendChild(el);
  });
}
function select(id,pan){
  st.sel=id;
  const w=DATA.find(x=>x.id===id);
  render();                                   // 목록·마커를 먼저 다시 그린 뒤
  DATA.forEach(x=> markers[x.id].setIcon(pinIcon(x, x.id===id)));
  if(window.matchMedia("(max-width:760px)").matches && pan) setView("map");
  if(pan) map.setView([w.mlat,w.mlon], Math.max(map.getZoom(),16), {animate:true});
  markers[id].openPopup();                    // 팝업을 연다 (순서 바뀌면 닫혀버림)
  const el=document.querySelector(".item.sel");
  if(el) el.scrollIntoView({block:"nearest"});
  toast(`${SHORT(w.dept)} · ${posLabel(w)}`);
}

/* ===== 동선 ===== */
function routebar(){
  const bar=document.getElementById("rbar");
  bar.classList.toggle("on", st.picked.size>0);
  document.getElementById("rn").textContent=st.picked.size;
}
document.getElementById("rclr").onclick=()=>{ st.picked.clear(); routebar(); render(); };
document.getElementById("ropen").onclick=()=>{
  const sel=DATA.filter(w=>st.picked.has(w.id)).sort((a,b)=>sortKey(a)-sortKey(b));
  const box=document.getElementById("steps"); box.innerHTML="";
  sel.forEach((w,i)=>{
    const d=document.createElement("div");
    d.className="step"; d.style.setProperty("--c",ZC[w.zone]);
    d.innerHTML=`<div class="n">${i+1}</div>
      <div class="meta"><div class="nm">${w.name}</div>
      <div class="ad">${posLabel(w)} · ${w.addr}</div></div>
      <a class="go" target="_blank" rel="noopener"
         href="https://map.kakao.com/link/to/${encodeURIComponent(w.name)},${w.lat},${w.lon}">길찾기</a>`;
    box.appendChild(d);
  });
  document.getElementById("modal").classList.add("on");
};
document.getElementById("copyall").onclick=()=>{
  const sel=DATA.filter(w=>st.picked.has(w.id)).sort((a,b)=>sortKey(a)-sortKey(b));
  copy(sel.map((w,i)=>`${i+1}. [${SHORT(w.dept)} ${ZLABEL[w.zone]||w.zone+"-"+w.order}] ${w.name} / ${w.addr}`).join("\n"),"동선 목록을 복사했습니다");
};
document.getElementById("mclose").onclick=document.getElementById("mclose2").onclick=
  ()=>document.getElementById("modal").classList.remove("on");
document.getElementById("modal").onclick=e=>{ if(e.target.id==="modal") e.target.classList.remove("on"); };

/* ===== 유틸 ===== */
function copy(text,msg){
  const done=()=>toast(msg||"복사했습니다");
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(text).then(done,()=>fb()); }
  else fb();
  function fb(){
    const t=document.createElement("textarea"); t.value=text; t.style.position="fixed"; t.style.opacity=0;
    document.body.appendChild(t); t.select();
    try{ document.execCommand("copy"); done(); }catch(e){ toast("복사에 실패했습니다"); }
    t.remove();
  }
}
window.copyAddr = id => { const w=DATA.find(x=>x.id===id); copy(w.addr, "주소를 복사했습니다"); };
let tt;
function toast(m){
  const el=document.getElementById("toast"); el.textContent=m; el.classList.add("on");
  clearTimeout(tt); tt=setTimeout(()=>el.classList.remove("on"),1800);
}
function fitAll(){
  const vis=DATA.filter(visible);
  if(!vis.length) return;
  map.fitBounds(L.latLngBounds(vis.map(w=>[w.mlat,w.mlon])),{padding:[45,45]});
}
function setView(v){
  document.body.dataset.view=v;
  document.querySelectorAll(".mtabs button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  if(v==="map") setTimeout(()=>map.invalidateSize(),60);
}

/* ===== 이벤트 ===== */
function syncDept(){
  document.querySelectorAll("#dept button").forEach(x=>x.classList.toggle("on",x.dataset.d===st.dept));
}
/* 구역 헤더 클릭 → 그 구역만 보기 / 한 번 더 누르면 전체로 복귀 */
function isSolo(dept,zone){ return st.zones.size===1 && st.zones.has(zone); }
function soloZone(dept,zone){
  // 과 선택 탭과 구역 칩은 건드리지 않는다 (구역을 골라도 위 패널이 그대로 있도록)
  st.zones = isSolo(dept,zone) ? new Set(deptZones()) : new Set([zone]);
  render(); fitAll();
  document.querySelector(".list").scrollTop=0;
}
document.getElementById("dept").onclick=e=>{
  const b=e.target.closest("button"); if(!b) return;
  st.dept=b.dataset.d;
  syncDept();
  st.zones=new Set(deptZones());
  render(); fitAll();
};
const q=document.getElementById("q");
q.oninput=()=>{
  st.q=norm(q.value)||q.value.trim();
  if(!q.value.trim()) st.q="";
  document.getElementById("sw").classList.toggle("has", !!q.value);
  render();
  const vis=DATA.filter(visible);
  if(st.q && vis.length) fitAll();
};
q.onkeydown=e=>{
  if(e.key!=="Enter") return;
  const vis=DATA.filter(visible).sort((a,b)=>sortKey(a)-sortKey(b));
  if(vis.length) select(vis[0].id,true);
};
document.getElementById("qc").onclick=()=>{ q.value=""; st.q=""; document.getElementById("sw").classList.remove("has"); render(); fitAll(); };
document.getElementById("fit").onclick=fitAll;
document.querySelector(".mtabs").onclick=e=>{ const b=e.target.closest("button"); if(b) setView(b.dataset.v); };
document.getElementById("rev").textContent="기준 "+REV;

initFlow(); render(); fitAll(); routebar();
</script>
</body>
</html>
